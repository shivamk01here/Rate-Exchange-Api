server:
  port: 8080

providers:
  configs:
    EXCHANGE_RATE_API:
      baseUrl: https://api.exchangerate-api.com
    OPEN_EXCHANGE_RATES:
      baseUrl: https://openexchangerates.com

audit:
  retention: 90d
  default-history-limit: 200

cache:
  ttl: 10m
  max-size: 5000
  eviction-interval-ms: 60000

batch:
  max-size: 25

health:
  enabled: true

export:
  max-export-size: 50000
  json:
    pretty-print: true
    date-format: iso
    include-null-fields: false

alert:
  evaluation:
    interval-ms: 120000

rate-trend:
  enabled: true
  max-snapshots-per-pair: 1000
  display-limit: 20
  stability-threshold-percent: 0.3
  cleanup-interval-minutes: 120

notification:
  email:
    enabled: true
    from: alerts@exchangerate.prod
  sms:
    enabled: true
    default-provider: TWILIO
    from: ExchangeRate
  whatsapp:
    enabled: true
    default-provider: TWILIO
    from: ExchangeRate

portfolio:
  max-portfolios: 100
  enabled: true
  max-holdings-per-portfolio: 100
