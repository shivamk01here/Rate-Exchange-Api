server:
  port: 8080

providers:
  configs:
    EXCHANGE_RATE_API:
      baseUrl: https://api.exchangerate-api.com
    OPEN_EXCHANGE_RATES:
      baseUrl: https://openexchangerates.com

audit:
  retention: 90d
  default-history-limit: 200

cache:
  ttl: 10m
  max-size: 5000
  eviction-interval-ms: 60000

batch:
  max-size: 25

health:
  enabled: true
