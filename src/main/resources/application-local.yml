server:
  port: 8080

providers:
  configs:
    EXCHANGE_RATE_API:
      baseUrl: https://test.api.exchangerate-api.com
    OPEN_EXCHANGE_RATES:
      baseUrl: https://test.openexchangerates.com

audit:
  retention: 7d
  default-history-limit: 100

cache:
  ttl: 1m
  max-size: 500
  eviction-interval-ms: 15000

batch:
  max-size: 10

health:
  enabled: true

export:
  json:
    pretty-print: true
    date-format: iso
    include-null-fields: false

alert:
  evaluation:
    interval-ms: 30000

rate-trend:
  enabled: true
  max-snapshots-per-pair: 100
  display-limit: 10
  stability-threshold-percent: 0.5
  cleanup-interval-minutes: 30

notification:
  email:
    enabled: true
    from: noreply@exchangerate.local
  sms:
    enabled: true
    default-provider: CONSOLE
    from: ExchangeRate
  whatsapp:
    enabled: true
    default-provider: CONSOLE
    from: ExchangeRate

portfolio:
  max-portfolios: 10
  enabled: true
  max-holdings-per-portfolio: 30

spring:
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
