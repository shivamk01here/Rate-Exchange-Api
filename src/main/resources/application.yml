server:
  port: 8080

spring:
  application:
    name: exchange-rate-service
  mail:
    host: localhost
    port: 1025
    username:
    password:

app:
  version: @project.version@

logging:
  level:
    com.example.exchangerate: DEBUG

providers:
  configs:
    EXCHANGE_RATE_API:
      baseUrl: https://api.exchangerate-api.example.com
    OPEN_EXCHANGE_RATES:
      baseUrl: https://openexchangerates.example.com

audit:
  retention: 30d
  default-history-limit: 50

cache:
  ttl: 5m
  max-size: 1000
  eviction-interval-ms: 30000

batch:
  max-size: 10

health:
  enabled: true

export:
  max-export-size: 10000
  filename: conversion-history
  json:
    pretty-print: false
    date-format: iso
    include-null-fields: false

alert:
  evaluation:
    interval-ms: 60000

rate-limit:
  enabled: true
  default-requests-per-window: 100
  window-size: 1m
  bypass-paths:
    - /api/health
    - /api/version
    - /api/rate-limit
    - /api/portfolio/count
  endpoints:
    /api/rates:
      max-requests: 30
      window: 1m
    /api/rates/batch:
      max-requests: 10
      window: 1m
    /api/rates/compare:
      max-requests: 20
      window: 1m
    /api/rates/convert:
      max-requests: 30
      window: 1m
    /api/portfolio:
      max-requests: 20
      window: 1m
    /api/portfolio/*/value:
      max-requests: 10
      window: 1m

favorites:
  max-favorites: 50
  enabled: true
  max-label-length: 100

portfolio:
  max-portfolios: 20
  enabled: true
  max-holdings-per-portfolio: 50

rate-trend:
  enabled: true
  max-snapshots-per-pair: 500
  display-limit: 10
  stability-threshold-percent: 0.5
  cleanup-interval-minutes: 60

notification:
  email:
    enabled: true
    from: noreply@exchangerate.local
    subject-template: "Rate Alert: {from}->{to}"
  sms:
    enabled: true
    default-provider: CONSOLE
    from: ExchangeRate
  whatsapp:
    enabled: true
    default-provider: CONSOLE
    from: ExchangeRate

alert-history:
  enabled: true
  max-page-size: 50
  max-entries: 5000
  track-notifications: true
  stats-top-pairs-limit: 5
  recent-window-hours: 24

calculator:
  enabled: true
  max-history-size: 100
  decimal-scale: 4
  auto-clean-enabled: false
  auto-clean-interval-ms: 3600000
  summary-enabled: true
  summary-top-pairs-limit: 5
  summary-top-providers-limit: 5

conversion-notes:
  enabled: true
  max-notes: 200
  max-note-length: 500
